# =================================================================
# Mosquitto Broker Configuration for IoT CO2 Monitoring
# =================================================================

# Listen on port 1883 across all network interfaces (LAN & Localhost)
listener 1883
socket_domain ipv4

# Enforce authentication - remote and local clients must supply credentials
allow_anonymous false

# Password file containing hashed credentials (esp32, gateway)
password_file c:/Users/lokak/Desktop/Blockchain Based C02 Emission Monitoring using IOT/mosquitto_passwd

